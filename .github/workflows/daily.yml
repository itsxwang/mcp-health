name: daily-health-run
# Free scheduled runs on public repos. The runner is an ephemeral VM —
# satisfying the "run hostile code on a throwaway machine" guidance.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install uv (ephemeral PyPI venvs)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run harness batch + rebuild site
        run: |
          python -m harness.run --limit 40 --workers 4 || true
          python sitegen.py --base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
      - name: publish
        run: |
          git config user.name "health-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "daily run $(date -u +%F)" || echo "no changes"
          git push
