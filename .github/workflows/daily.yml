name: daily-health-run
# Free scheduled runs on public repos. The runner is an ephemeral VM —
# satisfying the "run hostile code on a throwaway machine" guidance.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install uv (ephemeral PyPI venvs)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: ingest submitted issues (server-submission intake)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m harness.intake || true
      - name: run harness batch + rebuild site
        run: |
          python -m harness.run --limit 40 --workers 4 || true
          python sitegen.py
      - name: publish site to gh-pages (orphan branch)
        run: |
          git config user.name "health-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin gh-pages --depth 1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git switch gh-pages
            git reset --hard origin/gh-pages
          else
            git switch --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.nojekyll' -exec rm -rf {} +
          cp -a site/* .
          touch .nojekyll
          git add -A
          git commit -m "deploy: MCP Health Index $(date -u +%FT%TZ)" || echo "no changes"
          git push origin gh-pages
      - name: persist data back to main
        run: |
          git switch main
          git add -A
          git commit -m "daily data $(date -u +%F)" || echo "no changes"
          git push origin main
